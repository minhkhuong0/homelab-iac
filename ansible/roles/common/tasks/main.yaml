- name: Set timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  become: true

- name: Upgrade and update
  ansible.builtin.package:
    upgrade: true
    update_cache: true
  become: true

- name: Install essential admin packages
  ansible.builtin.package:
    name:
      - htop
      - curl
    state: present
  become: true
