---
- name: Get k3s installed version
  ansible.builtin.command: k3s --version
  register: k3s_server_version_output
  changed_when: false
  #failed_when: k3s_server_version_output.rc != 0
  failed_when: false

- name: Download script
  when:
    k3s_server_version_output.rc != 0
  ansible.builtin.get_url:
    url: https://get.k3s.io/
    timeout: 120
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Init K3s cluster on first server
  when:
    - inventory_hostname == groups["k3s_servers"][0]
  block:
    - name: Ensure K3s dir exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'
        owner: ansible
      become: true

    - name: Write K3s init cluster config file
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0755'
        content: |
          write-kubeconfig-mode: "0644"
          cluster-init: true
          node-name: "{{ inventory_hostname }}"
          cluster-cidr: "{{ cluster_cidr }}"
          tls-san:
            - "{{ control_lb_ip }}"

    - name: Run K3s install script to init cluster
      ansible.builtin.command: /tmp/k3s-install.sh

    - name: Wait for token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/token
      become: true

    - name: Read token from first server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: cluster_token_raw
      become: true

    - name: Store token
      ansible.builtin.set_fact:
        cluster_token: "{{ cluster_token_raw.content | b64decode | trim }}"

    - name: Fetch credentials
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config
        flat: true
      
- name: Join K3s cluster on other servers
  when:
    - inventory_hostname != groups["k3s_servers"][0]
  block:
    - name: Ensure K3s dir exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'
        owner: ansible
      become: true

    - name: Write K3s init cluster config file
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0755'
        content: |
          write-kubeconfig-mode: "0644"
          server: https://{{ control_lb_ip }}:6443
          token: {{ hostvars[groups["k3s_servers"][0]].cluster_token }}
          node-name: "{{ inventory_hostname }}"
          cluster-cidr: "{{ cluster_cidr }}"
          tls-san:
            - "{{ control_lb_ip }}"

    - name: Run K3s install script to join cluster
      ansible.builtin.command: /tmp/k3s-install.sh

- name: Ensure Longhorn requirements
  block:
    - name: Install required packages
      ansible.builtin.package:
        name:
          - nfs-common
          - open-iscsi
        state: present
      become: true

    - name: Create ext4 fs on data disk
      community.general.filesystem:
        fstype: ext4
        dev: /dev/vdb
      become: true

    - name: Ensure mount directory exists
      ansible.builtin.file:
        path: /mnt/ssd
        state: directory
        mode: '0755'
        owner: ansible
      become: true

    - name: Mount data disk
      ansible.posix.mount:
        path: /mnt/ssd
        src: /dev/vdb
        fstype: ext4
        opts: defaults
        state: mounted
      become: true

    - name: Ensure mount directory exists
      ansible.builtin.file:
        path: /mnt/ssd
        state: directory
        mode: '0755'
        owner: ansible
      become: true
