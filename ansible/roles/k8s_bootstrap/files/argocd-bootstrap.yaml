apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/minhkhuong0/homelab-iac
    targetRevision: HEAD
    path: kubernetes/core
  destination:
    server: https://kubernetes.default.svc
    namespace: '{{.path.basename}}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
