apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/minhkhuong0/homelab-iac
      revision: HEAD
      directories:
      - path: kubernetes/apps/*
  template:
    metadata:
      name: '{{.path.basename}}'
      finalizers:
        - resource-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/minhkhuong0/homelab-iac
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
