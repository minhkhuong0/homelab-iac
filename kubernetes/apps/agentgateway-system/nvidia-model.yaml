apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: nvidia
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
    sectionName: http
  match:
    model: "nvidia/*"
  provider: OpenAI
  baseURL: https://integrate.api.nvidia.com/v1
  policies:
    auth:
      secretRef:
        name: nvidia-token
    transformations:
    - field: model
      expression: 'llmRequest.model.stripPrefix("nvidia/")'
