apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: ollama
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
    sectionName: http
  match:
    model: "ollama/*"
  provider: OpenAI
  baseURL: http://ollama.ollama.svc.cluster.local:11434/v1
  policies:
    transformations:
    - field: model
      expression: 'llmRequest.model.stripPrefix("ollama/")'
