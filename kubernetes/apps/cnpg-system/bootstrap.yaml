apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prod
spec:
  instances: 3

  bootstrap:
    initdb:
      database: openbao
      owner: openbao
      secret:
        name: openbao-secret
  storage:
    storageClass: longhorn-single
    size: 20Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
  managed:
    roles:
      - name: vaultwarden
        login: true
        passwordSecret:
          name: vaultwarden-db
