apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prod
spec:
  instances: 3

  bootstrap:
    initdb:
      database: openbao
      owner: openbao
      secret:
        name: openbao-secret

  storage:
    storageClass: longhorn-single
    size: 20Gi
  managed:
    roles:
      - name: vaultwarden
        ensure: present
        login: true
        passwordSecret: vaultwarden-db
