apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "https://openbao.openbao.svc.cluster.local:8200"
      version: "v2"
      path: "kv"
      namespace: "k8s"
      auth:
        tokenSecretRef:
          name: "openbao-secret"
          key: "token"
      caProvider:
        type: "ConfigMap"
        name: "selfsigned-ca"
        namespace: "external-secrets"
        key: "root-certs.pem"
