apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "https://openbao.openbao.svc.cluster.local:8200"
      path: "kv-v2"
      version: "v2"
      namespace: "root"
      auth:
        tokenSecretRef:
          name: "openbao-secret"
          key: "token"
      caProvider:
        type: "ConfigMap"
        name: "kube-root-ca.crt"
        namespace: "kube-system"
        key: "ca.crt"
