apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
      - name: forgejo
        image: codeberg.org/forgejo/forgejo:17
        ports:
        - containerPort: 3000
        - containerPort: 22
        env:
          - name: FORGEJO__database__DB_TYPE
            value: postgres
          - name: FORGEJO__database__HOST
            value: prod-rw.cnpg-system.svc.cluster.local:5432
          - name: FORGEJO__database__NAME
            value: forgejo
          - name: FORGEJO__database__USER
            value: forgejo
          - name: FORGEJO__database__PASSWD
            valueFrom:
              secretKeyRef:
                name: forgejo-db
                key: password
          - name: FORGEJO__metrics__ENABLED
            value: "true"
          - name: FORGEJO__metrics__TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-metrics
                key: token
          - name: FORGEJO__server__LANDING_PAGE
            value: /khuong
        volumeMounts:
        - name: forgejo-data
          mountPath: /data
      volumes:
      - name: forgejo-data
        persistentVolumeClaim:
          claimName: forgejo-data

