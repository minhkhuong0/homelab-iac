apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-websecure
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`forge.nhmk.de`)
    services:
    - name: forgejo
      port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-web
spec:
  entryPoints:
    - web
  routes:
  - kind: Rule
    match: Host(`forge.nhmk.de`)
    services:
    - name: forgejo
      port: 3000
