apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forgejo
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: forgejo
  endpoints:
  - port: http
    path: /metrics
    scheme: http
    interval: 15s
    bearerTokenSecret:
      name: forgejo-metrics
      key: token
