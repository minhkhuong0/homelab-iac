apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    chart: jellyfin
    repoURL: https://jellyfin.github.io/jellyfin-helm
    targetRevision: 3.7.0
    helm:
      values: |
        persistence:
          cache:
            enabled: true
            type: nfs
            nfsServer: 10.42.0.12
            nfsPath: /zfs/data/jellyfin/cache
          config:
            enabled: true
            type: nfs
            nfsServer: 10.42.0.12
            nfsPath: /zfs/data/jellyfin/config
            readOnly: false
          media:
            enabled: true
            type: nfs
            nfsServer: 10.42.0.12
            nfsPath: /zfs/data/media
            

  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
