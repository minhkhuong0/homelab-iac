apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin
  labels:
    app: joplin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joplin
  template:
    metadata:
      labels:
        app: joplin
    spec:
      containers:
        - name: joplin
          image: joplin/server:latest
          ports:
            - containerPort: 22300
          env:
            - name: APP_PORT
              value: "22300"
            - name: APP_BASE_URL
              value: https://joplin.nhmk.de
            - name: DB_CLIENT
              value: pg
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: joplin-db
                  key: password
            - name: POSTGRES_DB
              value: joplin
            - name: POSTGRES_USER
              value: joplin
            - name: POSTGRES_HOST
              value: prod-rw.cnpg-system.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
