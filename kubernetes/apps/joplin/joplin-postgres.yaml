apiVersion: v1
kind: Service
metadata:
  name: wordpress-mysql
  labels:
    app: wordpress
spec:
  ports:
    - port: 3306
  selector:
    app: wordpress
    tier: mysql
  clusterIP: None
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pv-claim
  labels:
    app: joplin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin-postgres
  labels:
    app: joplin
spec:
  selector:
    matchLabels:
      app: joplin
      tier: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: joplin
        tier: postgres
    spec:
      containers:
      - image: postgres:latest
        name: postgres
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-pass
              key: password
        - name: POSTGRES_DB
          value: joplin
        - name: POSTGRES_USER
          value: joplin
        ports:
        - containerPort: 5432
          name: mysql
        volumeMounts:
        - name: postgres-persistent-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: postgres-persistent-storage
        persistentVolumeClaim:
          claimName: postgres-pv-claim

