apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin
  labels:
    app: joplin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: joplin
      tier: server
  template:
    metadata:
      labels:
        app: joplin
        tier: server
    spec:
      containers:
        - name: joplin
          image: joplin/server:latest
          ports:
            - containerPort: 22300
          env:
            - name: APP_PORT
              value: "22300"
            - name: APP_BASE_URL
              value: https://joplin.nhmk.de
            - name: DB_CLIENT
              value: pg
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openbao-secret
                  key: password
            - name: POSTGRES_DB
              value: joplin
            - name: POSTGRES_USER
              value: openbao
            - name: POSTGRES_HOST
              value: prod-rw.cnpg-system.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: joplin
spec:
  #type: LoadBalancer
  selector:
    app: joplin
    tier: server
  ports:
    - port: 80
      targetPort: 22300
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: joplin
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`joplin.nhmk.de`)
    services:
    - name: joplin
      port: 80
  tls:
    certResolver: le
