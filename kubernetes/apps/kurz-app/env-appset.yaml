apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: env-kurz
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  template:
    metadata:
      name: '{{.env}}-kurz'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/minhkhuong0/homelab-iac
        targetRevision: HEAD
        path: 'kubernetes/deploy/kurz/{{.env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}-kurz'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
