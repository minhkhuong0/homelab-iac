apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: kube-prometheus-stack
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`grafana.nhmk.de`)
    services:
    - name: kube-prometheus-stack-grafana
      port: 80
  tls:
    certResolver: le
