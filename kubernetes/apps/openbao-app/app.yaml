apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
spec:
  project: default
  source:
    chart: openbao
    repoURL: https://openbao.github.io/openbao-helm
    targetRevision: 0.30.4
    helm:
      values: |
        global:
          tlsDisable: false
        server:
          extraSecretEnvironmentVars:
            - envName: BAO_PG_CONNECTION_URL
              secretName: openbao-db-secret
              secretKey: connection_url
            - envName: UNSEAL_KEY
              secretName: openbao-unseal-secret
              secretKey: unseal_key
          volumes:
            - name: userconfig-openbao-server-tls
              secret:
                defaultMode: 420
                secretName: openbao-tls
          volumeMounts:
            - mountPath: /openbao/userconfig/openbao-server-tls
              name: userconfig-openbao-server-tls
              readOnly: true
          extraEnvironmentVars:
            BAO_CACERT: /openbao/userconfig/openbao-server-tls/ca.crt
          ha:
            enabled: true
            config: |
              ui = true

              listener "tcp" {
                address = "[::]:8200"
                cluster_address = "[::]:8201"
                tls_cert_file = "/openbao/userconfig/openbao-server-tls/tls.crt"
                tls_key_file = "/openbao/userconfig/openbao-server-tls/tls.key"
                tls_client_ca_file = "/openbao/userconfig/openbao-server-tls/ca.crt"
              }
              storage "postgresql" {

              }
              seal "static" {
                current_key_id = "20261027-0"
                current_key = "env://UNSEAL_KEY"
              }

              audit "file" "to-stdout" {
                description = "Write audit information to standard output."
                options {
                  file_path = "stdout"
                  log_raw = "true"
                }
              }
              log_requests_level = "debug"
              log_level = "debug"

          service:
            enabled: true

          dataStorage:
            enabled: true
            size: 10Gi
            storageClass: longhorn
            accessMode: ReadWriteOnce

        ui:
          enabled: true
          serviceType: LoadBalancer
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
