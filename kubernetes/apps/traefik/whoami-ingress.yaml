apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-websecure
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`whoami.nhmk.de`)
    services:
    - name: whoami
      namespace: whoami
      port: 80
  tls:
    secretName: le-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-web
spec:
  entryPoints:
    - web
  routes:
  - kind: Rule
    match: Host(`whoami.nhmk.de`)
    services:
    - name: whoami
      namespace: whoami
      port: 80
