apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
      - name: vaultwarden
        image: vaultwarden/server:latest
        ports:
        - containerPort: 80
        env:
        - name: WEBSOCKET_ENABLED
          value: "true"
        - name: DATABASE_URL
          value: postgresql://prod-rw.cnpg-system.svc.cluster.local:5432/vaultwarden
        - name: PGUSER
          value: vaultwarden
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-db
              key: password
        volumeMounts:
        - name: vaultwarden-data
          mountPath: /data
      volumes:
      - name: vaultwarden-data
        persistentVolumeClaim:
          claimName: vaultwarden-data
