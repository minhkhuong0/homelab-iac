apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prod
  namespace: cnpg-system
spec:
  instances: 2
  bootstrap:
    recovery:
      source: source
  externalClusters:
  - name: source
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: garage
        serverName: prod
  storage:
    size: 20Gi
    storageClass: longhorn-single
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
  managed:
    roles:
      - name: vaultwarden
        login: true
        passwordSecret:
          name: vaultwarden-db
      - name: openbao
        login: true
        passwordSecret:
          name: openbao-secret
