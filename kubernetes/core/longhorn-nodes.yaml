kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "2880"
  fromBackup: ""
  fsType: "ext4"
reclaimPolicy: "Retain"
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-single
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  fromBackup: ""
  fsType: "ext4"
reclaimPolicy: "Retain"
---
apiVersion: v1
kind: Node
metadata:
  name: k3s-server-0
  labels:
    node.longhorn.io/create-default-disk: "config"
  annotations:
    node.longhorn.io/default-disks-config: |
      [
        {
          "path": "/mnt/ssd",
          "allowScheduling": true,
          "storageReserved": 0,
          "tags": ["ssd", "fast"]
        }
      ]
---
