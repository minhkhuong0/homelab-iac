---
apiVersion: v1
kind: Node
metadata:
  name: k3s-server-0
  labels:
    node.longhorn.io/create-default-disk: "config"
  annotations:
    node.longhorn.io/default-disks-config: |
      [
        {
          "path": "/dev/vdb",
          "allowScheduling": true,
          "storageReserved": 0,
          "tags": ["ssd", "fast"]
        }
      ]
