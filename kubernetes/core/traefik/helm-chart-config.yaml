apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      annotations:
        metallb.io/loadBalancerIPs: 10.42.0.254
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    ports:
      forgejo-ssh:
        port: 2222
        expose:
          default: true
        protocol: TCP
