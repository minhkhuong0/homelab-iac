apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: selfsigned-ca
  namespace: trust-manager
spec:
  sources:
    - secret:
        name: root-secret
        key: ca.crt
  target:
    configMap:
      key: root-certs.pem
      metadata:
        labels:
          app.kubernetes.io/component: trust-bundle
