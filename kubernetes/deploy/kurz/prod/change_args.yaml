apiVersion: apps/v1
kind: Deployment
metadata:
  name: kurz
spec:
  template:
    spec:
      containers:
        - name: kurz
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: kurz-db
                  key: password
            - name: POSTGRESQL_URL
              value: "postgres://kurz:$(PGPASSWORD)@prod-rw.cnpg-system.svc.cluster.local:5432/kurz"
